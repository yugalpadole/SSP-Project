<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>E-Bazaar — Local Market Shopping & Shopkeeper Platform</title>
    <meta name="description" content="Discover nearby neighborhood shops, compare product prices, check real-time stock, and choose fast home delivery or instant reserve & collect with E-Bazaar." />
    <meta name="keywords" content="local market, neighborhood shopping, quick commerce, reserve and collect, store pickup, shopkeeper platform, fresh produce, grocery" />
    <meta name="theme-color" content="#16a34a" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ebazaar-local.com/" />
    <meta property="og:title" content="E-Bazaar — Connecting Local Markets Digitally" />
    <meta property="og:description" content="Discover nearby neighborhood shops, compare product prices, check real-time stock, and choose fast home delivery or instant reserve & collect." />
    <meta property="og:image" content="/logoWithBG.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="E-Bazaar — Connecting Local Markets Digitally" />
    <meta property="twitter:description" content="Support local shopkeepers. Browse neighborhood markets, reserve products, compare prices, and order fresh." />
    <meta property="twitter:image" content="/logoWithBG.png" />

    <!-- Preconnect Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "E-Bazaar",
        "url": "https://ebazaar-local.com/",
        "description": "Local market shopping and quick commerce platform connecting shoppers with neighborhood merchants.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://ebazaar-local.com/products?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body class="font-sans antialiased text-stone-800 bg-[#fbf9f4]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
